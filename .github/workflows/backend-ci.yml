name: Storage Worker CI
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Worker
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund && npm run check
      - name: Wrangler dry run
        working-directory: backend
        run: npx wrangler deploy --config wrangler.production.jsonc --dry-run
