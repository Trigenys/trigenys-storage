name: AppFactory Infrastructure — Storage Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".appfactory/worker.json"
      - ".github/workflows/appfactory-infrastructure.yml"
permissions:
  contents: read
  id-token: write
concurrency:
  group: trigenys-storage-infrastructure
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Obtain GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("appfactory-api");
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Verify scoped request
        run: |
          jq -e '.repository == "Trigenys/trigenys-storage"
            and .runtime == "typescript-wrangler"
            and .environment == "production"
            and .workerName == "trigenys-storage-api"
            and .rootDirectory == "/backend"
            and .r2.recipe == "private-media"' .appfactory/worker.json
      - name: Provision private R2 + Worker through AppFactory
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          code="$(curl --silent --show-error \
            --output "$response_file" --write-out "%{http_code}" \
            -X POST -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @.appfactory/worker.json \
            https://appfactory-api.lawrynnjennifer.workers.dev/infrastructure/worker)"
          jq '{status,error,message,requiredPermissions,infrastructure}' "$response_file"
          if [[ "$code" != "200" ]]; then
            echo "::error::AppFactory returned HTTP $code"
            exit 1
          fi
          test "$(jq -r '.status' "$response_file")" = "PROVISIONED"
